name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The build runs on Vercel, not on the runner: `vercel build` with a
      # pnpm project adds Vercel-infrastructure-only binary paths to PATH and
      # dies with "spawn pnpm ENOENT" on GitHub runners (vercel/vercel#15204).
      - name: Deploy to Vercel (production)
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
