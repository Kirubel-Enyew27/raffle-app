<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-dark-32.png" data-kwik-favicon data-size="32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-dark-16.png" data-kwik-favicon data-size="16" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KWIK</title>
    <meta name="description" content="KWIK — fast multiplayer games, raffles, and leaderboards. Play. Compete. Win." />
    <meta name="application-name" content="KWIK" />
    <meta name="apple-mobile-web-app-title" content="KWIK" />
    <meta property="og:title" content="KWIK" />
    <meta property="og:description" content="Fast multiplayer games, raffles, and leaderboards. Play. Compete. Win." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Apply the saved theme before first paint so the dark KWIK shell never
      // flashes white. Defaults to dark, matching the app's ThemeProvider.
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0a0a0b' : '#f7f8fa');
          var icons = document.querySelectorAll('link[data-kwik-favicon]');
          for (var i = 0; i < icons.length; i++) {
            icons[i].href = '/brand/favicon-' + (dark ? 'dark' : 'light') + '-' + icons[i].getAttribute('data-size') + '.png';
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
